<!DOCTYPE html>
<html lang="te">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TelAI — తెలుగు AI</title>

    <link
        rel="stylesheet"
        href="/static/css/styles.css"
    >

</head>


<body>

<div class="app">


    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                T
            </div>

            <div>

                <div class="brand-name">
                    TelAI
                </div>

                <div class="brand-subtitle">
                    తెలుగు AI
                </div>

            </div>

        </div>


        <!-- NEW CHAT -->

        <button
            id="clearButton"
            class="new-chat-button"
            type="button"
        >

            <span>＋</span>

            కొత్త మాట

        </button>


        <!-- CHAT HISTORY -->

        <div class="sidebar-section">

            <div class="section-title">
                ఈరోజు
            </div>


            <div class="chat-item active">

                <span class="chat-icon">
                    ◌
                </span>

                <span>
                    కొత్త సంభాషణ
                </span>

            </div>

        </div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <div class="status">

                <span class="status-dot"></span>

                <span>
                    AI పనిచేస్తోంది
                </span>

            </div>


            <div class="powered">
                Groq ఆధారితం
            </div>

        </div>

    </aside>


    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main class="main">


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="mobile-brand">

                <div class="brand-icon small">
                    T
                </div>

                <span>
                    TelAI
                </span>

            </div>


            <div class="model-info">

                <span class="model-name">
                    తెలుగు AI
                </span>

                <span class="model-badge">
                    AI
                </span>

            </div>


            <button
                id="mobileNewChat"
                class="mobile-new-chat"
                type="button"
                aria-label="కొత్త మాట"
            >

                ＋

            </button>

        </header>


        <!-- ========================= -->
        <!-- CHAT -->
        <!-- ========================= -->

        <section
            id="chatContainer"
            class="chat-container"
        >

            <div class="welcome">

                <div class="welcome-icon">
                    T
                </div>


                <h1>
                    ఏమి తెలుసుకొనగోరుతున్నావు?
                </h1>


                <p>
                    తెలుగులో ఏదైనా అడుగు.
                    మేలిమి తెలుగు పదాలు, పదనిర్మాణం
                    లేదా భాషా నియమాల గురించి కూడా అడగవచ్చు.
                </p>


                <div class="suggestions">


                    <button
                        class="suggestion"
                        data-message="మేలిమి తెలుగు అంటే ఏమిటి?"
                        type="button"
                    >

                        <span>
                            ◈
                        </span>

                        మేలిమి తెలుగు అంటే ఏమిటి?

                    </button>


                    <button
                        class="suggestion"
                        data-message="హత్తరం అనే పదానికి అర్థం ఏమిటి?"
                        type="button"
                    >

                        <span>
                            ◇
                        </span>

                        పదం అర్థం అడుగు

                    </button>


                    <button
                        class="suggestion"
                        data-message="ఒక కొత్త మేలిమి తెలుగు పదాన్ని సూచించు."
                        type="button"
                    >

                        <span>
                            ✦
                        </span>

                        కొత్త పదం సూచించు

                    </button>


                    <button
                        class="suggestion"
                        data-message="మేలిమి తెలుగు పదనిర్మాణ నియమాలను వివరించు."
                        type="button"
                    >

                        <span>
                            ⌘
                        </span>

                        పదనిర్మాణం నేర్చుకో

                    </button>

                </div>

            </div>

        </section>


        <!-- ========================= -->
        <!-- COMPOSER -->
        <!-- ========================= -->

        <div class="composer-area">

            <form
                id="chatForm"
                class="composer"
            >

                <textarea
                    id="messageInput"
                    placeholder="తెలుగులో అడుగు..."
                    rows="1"
                    autocomplete="off"
                ></textarea>


                <button
                    type="submit"
                    id="sendButton"
                    aria-label="పంపు"
                >

                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                    >

                        <path
                            d="M5 12H19M19 12L13 6M19 12L13 18"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>

            </form>


            <div class="composer-footer">

                TelAI తప్పులు చేయవచ్చు.
                ముఖ్యమైన సమాచారాన్ని నిర్ధారించుకో.

            </div>

        </div>

    </main>

</div>


<script src="/static/js/chatbot.js"></script>

</body>

</html>
